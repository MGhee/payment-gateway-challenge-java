spring.application.name=payment-gateway
server.port=8090
# On shutdown, let in-flight payments finish (bank connect + read timeout); the scheduler's
# lifecycle phase already lets a running reversal batch finish within the same timeout
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_gateway}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:payment_gateway}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}

# Acquiring bank; override the URL with the BANK_URL environment variable
bank.url=http://localhost:8080
bank.connect-timeout=2s
bank.read-timeout=10s
bank.circuit-breaker.sliding-window-size=10
bank.circuit-breaker.minimum-number-of-calls=5
bank.circuit-breaker.failure-rate-threshold=50
bank.circuit-breaker.wait-duration-in-open-state=30s
bank.circuit-breaker.permitted-calls-in-half-open-state=3
bank.bulkhead.max-concurrent-calls=20
bank.bulkhead.max-wait-duration=500ms
# Unknown bank outcomes are reversed in the background (ISO-8601 interval for @Scheduled)
bank.reversal-retry-interval=PT10S
bank.reversal-max-attempts=5
bank.reversal-retry-base-delay=10s
bank.authorization-recovery-grace-period=30s
bank.authorization-recovery-interval=PT30S
bank.reconciliation.directory=${BANK_RECONCILIATION_DIRECTORY:./settlements}
bank.reconciliation.cron=${BANK_RECONCILIATION_CRON:0 0 2 * * *}

gateway.admin-api-key=${GATEWAY_ADMIN_API_KEY:}
gateway.api-key-validity=365d
gateway.idempotency-retention=PT72H
gateway.idempotency-cleanup-interval=PT1H
# Per gateway instance; keeps one merchant from using every bank connection
gateway.merchant-max-concurrent-payments=10

# Reject fractional amounts instead of silently truncating them, and quoted numbers like "1050"
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Actuator runs on its own port so it can stay off the public network
management.server.port=8091
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

# W3C traceparent is accepted from callers and forwarded to the bank.
# Spans are exported only when MANAGEMENT_OTLP_TRACING_ENDPOINT is set.
management.tracing.sampling.probability=1.0

logging.pattern.level=%5p [%X{requestId:-}]