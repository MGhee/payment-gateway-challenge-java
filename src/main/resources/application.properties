spring.application.name=payment-gateway
server.port=8090

# Acquiring bank; override the URL with the BANK_URL environment variable
bank.url=http://localhost:8080
bank.connect-timeout=2s
bank.read-timeout=10s
# Unknown bank outcomes are reversed in the background (ISO-8601 interval for @Scheduled)
bank.reversal-retry-interval=PT10S
bank.reversal-max-attempts=5

# Reject fractional amounts instead of silently truncating them
spring.jackson.deserialization.accept-float-as-int=false

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

logging.pattern.level=%5p [%X{requestId:-}]