services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payment_gateway
      POSTGRES_USER: payment_gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_gateway -d payment_gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bank_simulator:
    container_name: bank_simulator
    image: bbyars/mountebank:2.8.1
    ports:
      - "2525:2525"
      - "8080:8080"
    command: --configfile /imposters/bank_simulator.ejs --allowInjection
    volumes:
      - type: bind
        source: ./imposters
        target: /imposters

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

  payment_gateway:
    container_name: payment_gateway
    build: .
    ports:
      - "8090:8090"
      - "127.0.0.1:8091:8091"
    environment:
      BANK_URL: http://bank_simulator:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_gateway
      SPRING_DATASOURCE_USERNAME: payment_gateway
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      GATEWAY_ADMIN_API_KEY: ${GATEWAY_ADMIN_API_KEY:?Set GATEWAY_ADMIN_API_KEY}
      BANK_RECONCILIATION_DIRECTORY: /app/settlements
      SPRING_PROFILES_ACTIVE: json-logs
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
    volumes:
      - ${BANK_RECONCILIATION_DIRECTORY:-./settlements}:/app/settlements:ro
    depends_on:
      bank_simulator:
        condition: service_started
      jaeger:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
      